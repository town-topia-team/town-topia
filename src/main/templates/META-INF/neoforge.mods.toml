modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

# GeckoLib mixins: optional (required=false in the file), so a GeckoLib that renamed a field cannot stop the game.
[[mixins]]
config="${mod_id}.geckolib.mixins.json"

# NeoForge dependency
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

# Minecraft dependency
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# GeckoLib dependency
[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[4.8,5)"
    ordering="AFTER"
    side="BOTH"
